name: Staging preview (manual, owner-gated)

# Cloudflare Pages staging deployment.
#
# Mechanism: official Cloudflare Pages actions —
#   - actions/upload-pages-artifact@v3  -> package `dist/` as a Pages artifact
#   - actions/deploy-pages@v4            -> deploy that Pages artifact to Cloudflare Pages
# These are the Cloudflare-official actions for Cloudflare Pages deployments; the
# previous "GitHub Pages" framing was inaccurate. No GitHub Pages actions are used.
#
# Safety: the only trigger is workflow_dispatch (manual). There is no push or PR
# trigger, so an ordinary push or PR cannot deploy. The maintainer must type STAGING
# and opt in with `publish: true`; the deploy job additionally requires the
# protected GitHub environment `staging`. The build job always runs validation and
# uploads a downloadable artifact; the Pages artifact is packaged only when `publish`
# is true, and only the deploy job consumes it.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type STAGING to confirm this manual staging build
        required: true
        type: string
      publish:
        description: Publish the built bundle to the protected staging Pages environment
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging-preview
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "STAGING" ]; then
            echo "::error::Type STAGING in the confirm input to run this workflow."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: guard
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact commit the maintainer selected, not a moving branch.
          ref: ${{ github.sha }}
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Build for the repository sub-path
        run: npm run build
        env:
          VITE_BASE_PATH: /DailyLingo/
      - run: npm run check:bundle
      - name: Upload downloadable preview (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: staging-preview-dist
          path: dist/
          retention-days: 14
      - name: Package Cloudflare Pages artifact
        if: inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          artifact_name: staging
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: inputs.publish
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Cloudflare Pages (staging)
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: staging
