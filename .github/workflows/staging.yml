name: Staging preview (manual, owner-gated)

# Cloudflare Pages staging deployment.
#
# Deployment mechanism, verified against official documentation on 2026-11-04:
#
#   cloudflare/wrangler-action is Cloudflare's own GitHub Action. It installs Wrangler
#   and runs the command given in `with.command`; `pages deploy <dir> --project-name=<p>`
#   uploads build output to a Cloudflare Pages Direct Upload project.
#     - https://developers.cloudflare.com/pages/how-to/use-direct-upload-with-continuous-integration/
#     - https://github.com/cloudflare/wrangler-action
#   Pinned to the commit behind release v4.1.3 (2026-09-24), the latest at audit time,
#   so the pinned action cannot be re-pointed. Update by moving the SHA to the commit
#   behind the newest tag and re-running build-only validation.
#
#   The previous revision used actions/upload-pages-artifact@v3 and actions/deploy-pages@v4.
#   Both are GitHub Pages actions — upload-pages-artifact describes itself as "A composite
#   action for packaging and uploading an artifact that can be deployed to GitHub Pages" —
#   and neither can deploy to Cloudflare Pages. They are removed here, together with the
#   `pages: write` and `id-token: write` permissions they required, because the workflow
#   no longer has a GitHub Pages site to deploy.
#
# Base path: Cloudflare Pages serves a project at the root of https://<project>.pages.dev/
# (preview deployments at https://<hash>.<project>.pages.dev/), so the bundle must be built
# with VITE_BASE_PATH=/. The earlier /DailyLingo/ base was a GitHub Pages project-site
# convention: on pages.dev every asset URL would 404, and locally `npm run check:bundle`
# resolves dist-root-relative and fails with ENOENT on dist/DailyLingo/assets/*.
#
# Credentials: only the deploy job reads CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
# and those should be secrets of the protected `staging` environment rather than repository
# secrets, so no other job can see them. The values reach the action only through `with:`;
# they are never echoed, never interpolated into a shell command, and never copied into the
# uploaded bundle (only a derived true/false presence is passed to the guard step). The
# token should be account-scoped and hold only `Cloudflare Pages: Edit`.
#
# Safety: workflow_dispatch is the only trigger, so no push or pull request can deploy.
# Publishing requires all of: the maintainer typing STAGING, `publish` explicitly set to
# true, and a second typed phrase DEPLOY-STAGING that is read by no other job — plus
# approval of the `staging` environment once the Owner configures required reviewers
# there. With `publish: false` the run is a credential-free build-only validation of the
# exact commit.
#
# Access control: no upload starts unless the production hostname already answers with a
# Cloudflare Access challenge. The probe is unauthenticated and treats a plain 404/200 as
# "not proven protected", so a missing project or a missing Access policy fails closed
# before publication. Preview and immutable deployment URLs cannot exist before the
# upload, so the same probe checks the production URL, the immutable deployment URL and
# the branch alias immediately afterwards. If protection is not proven on every URL - a
# confirmed exposure or an inconclusive probe after retries - the new deployment is
# deleted, the production hostname is re-probed, and the staging project is deleted if
# exposure remains. The run then fails closed. Setup and verification steps are in
# docs/ACCESS_CONTROL.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type STAGING to confirm this manual staging build
        required: true
        type: string
      publish:
        description: Deploy the bundle validated by this run to Cloudflare Pages staging
        required: true
        type: boolean
        default: false
      publish_phrase:
        description: Type DEPLOY-STAGING to authorize publishing (only read when publish=true)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: staging-preview
  cancel-in-progress: false

env:
  # Cloudflare Pages Direct Upload project name. Create it once, before the first
  # publication (this is part of the Owner gate):
  #   npx wrangler pages project create dailylingo-staging --production-branch staging
  # Cloudflare's Direct Upload guide creates the project that way and this workflow never
  # creates one, so the project has to exist before a publishing run.
  # A Direct Upload project's production branch is fixed at creation. `staging` has to be
  # it, otherwise --branch=staging lands on a preview deployment: still updated in place
  # under its branch alias URL, but not at the project root URL
  # https://dailylingo-staging.pages.dev.
  CLOUDFLARE_PAGES_PROJECT: dailylingo-staging
  STAGING_BRANCH: staging

jobs:
  guard:
    name: Require explicit confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the confirmation phrase
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "STAGING" ]; then
            echo "::error::Type STAGING in the confirm input to run this workflow."
            exit 1
          fi

  build:
    name: Build and validate (no Cloudflare credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: guard
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact commit the maintainer selected, not a moving branch.
          ref: ${{ github.sha }}
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Self-test the Cloudflare Access probe
        run: npm run test:access-control
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Build for the Cloudflare Pages root
        run: npm run build
        env:
          VITE_BASE_PATH: /
      - run: npm run check:bundle
      - name: Assert asset URLs are root-absolute, not sub-path based
        run: |
          if grep -q '"/DailyLingo/' dist/index.html; then
            echo "::error::dist/index.html still uses a /DailyLingo/ base. Cloudflare Pages serves at the root of <project>.pages.dev; build with VITE_BASE_PATH=/."
            exit 1
          fi
          grep -q 'src="/assets/' dist/index.html
      - name: Upload downloadable preview
        uses: actions/upload-artifact@v4
        with:
          name: staging-preview-dist
          path: dist/
          retention-days: 14

  deploy:
    name: Deploy to Cloudflare Pages (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: inputs.publish
    permissions:
      contents: read
      deployments: write
    environment:
      name: staging
      url: https://dailylingo-staging.pages.dev
    steps:
      # Two independent typed confirmations are required to publish, because until the
      # Owner configures required reviewers on the `staging` environment, GitHub approval
      # is not yet enforcing anything on its own. Referring to an undefined environment
      # does not create protection: the Owner must create it.
      - name: Require the publish authorization phrase
        env:
          PUBLISH_PHRASE: ${{ inputs.publish_phrase }}
        run: |
          if [ "$PUBLISH_PHRASE" != "DEPLOY-STAGING" ]; then
            echo "::error::Publishing requires typing DEPLOY-STAGING in the publish_phrase input, in addition to publish=true. Re-run with publish=false for build-only validation."
            exit 1
          fi

      # A missing token must fail loudly here instead of half-way through the upload.
      # The `secrets` context is not available in a step `if` (GitHub's context
      # availability table), so the values are mapped into `env` for this step only and
      # tested without ever being printed.
      - name: Require Cloudflare credentials
        env:
          CF_API_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CF_ACCOUNT_ID_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          missing=""
          if [ "$CF_API_TOKEN_PRESENT" != "true" ]; then
            missing="$missing CLOUDFLARE_API_TOKEN"
          fi
          if [ "$CF_ACCOUNT_ID_PRESENT" != "true" ]; then
            missing="$missing CLOUDFLARE_ACCOUNT_ID"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Required secret(s) not configured on the 'staging' environment:$missing. Run this workflow with publish=false to validate the build without credentials."
            exit 1
          fi
          echo "Both Cloudflare credentials are available to this job."

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Reuse the bundle the build job validated
        uses: actions/download-artifact@v4
        with:
          name: staging-preview-dist
          path: dist/

      # The production hostname must already answer with an Access challenge.
      # Preview/immutable deployment URLs cannot exist until this upload, so they
      # are probed immediately afterwards and rolled back if not protected.
      - name: Require Cloudflare Access on the production hostname
        env:
          ACCESS_PROBE_RETRIES: '2'
          ACCESS_PROBE_RETRY_DELAY_MS: '2000'
          STAGING_URL: https://dailylingo-staging.pages.dev/
        run: |
          node scripts/verify-access-control.mjs "$STAGING_URL"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ env.STAGING_BRANCH }} --commit-hash=${{ github.sha }}
          # The repository carries both package-lock.json and bun.lock; state the intent
          # instead of leaving the action to infer it from whichever lockfile check comes
          # first in a future version.
          packageManager: npm
          wranglerVersion: '4.157.0'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Runs even when the deploy step failed, because a partial upload can still
      # have created a deployment. The probe always exits 0 in CI mode so its
      # outputs survive; the enforcement step below is the single failure point.
      - name: Verify the deployed URLs are behind Cloudflare Access
        id: access_check
        if: always()
        continue-on-error: true
        env:
          ACCESS_PROBE_ALWAYS_EXIT_ZERO: '1'
          ACCESS_PROBE_RETRIES: '4'
          ACCESS_PROBE_RETRY_DELAY_MS: '3000'
          STAGING_URL: https://dailylingo-staging.pages.dev/
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          urls=("$STAGING_URL")
          if [ -n "$DEPLOYMENT_URL" ]; then
            urls+=("$DEPLOYMENT_URL")
          fi
          if [ -n "$ALIAS_URL" ]; then
            urls+=("$ALIAS_URL")
          fi
          if [ "$DEPLOY_OUTCOME" = "success" ] && [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::wrangler reported no deployment URL after a successful deploy."
            {
              echo "protected=false"
              echo "unprotected=false"
              echo "inconclusive=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/verify-access-control.mjs "${urls[@]}"

      # A deployment that cannot be proven protected is removed. Inconclusive
      # probes after retries are included: an unverified staging deployment is
      # not allowed to stay live.
      - name: Delete the deployment when Access is not proven
        id: rollback
        if: always() && steps.access_check.outputs.protected != 'true' && steps.deploy.outputs.pages-deployment-id != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deployment delete ${{ steps.deploy.outputs.pages-deployment-id }} --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --force
          packageManager: npm
          wranglerVersion: '4.157.0'

      # A broken Access application can expose the previous deployment even
      # after the new one is deleted, so re-probe the production hostname.
      - name: Re-check Access after deleting the deployment
        id: access_recheck
        if: always() && steps.rollback.outcome == 'success'
        continue-on-error: true
        env:
          ACCESS_PROBE_ALWAYS_EXIT_ZERO: '1'
          ACCESS_PROBE_RETRIES: '2'
          ACCESS_PROBE_RETRY_DELAY_MS: '2000'
          STAGING_URL: https://dailylingo-staging.pages.dev/
        run: |
          node scripts/verify-access-control.mjs "$STAGING_URL"

      # Last-resort remediation with the Pages-scoped token: remove the staging
      # project's origin when exposure remains. The Owner must recreate the
      # project and Access applications before retrying.
      - name: Delete the staging project when exposure remains
        id: project_rollback
        if: always() && steps.access_check.outputs.protected != 'true' && steps.deploy.outputs.pages-deployment-id != '' && (steps.rollback.outcome == 'failure' || steps.rollback.outcome == 'skipped' || steps.access_recheck.outputs.protected != 'true')
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project delete ${{ env.CLOUDFLARE_PAGES_PROJECT }} --yes
          packageManager: npm
          wranglerVersion: '4.157.0'

      - name: Record the staging URL
        if: always()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
          ACCESS_PROTECTED: ${{ steps.access_check.outputs.protected }}
          ACCESS_UNPROTECTED: ${{ steps.access_check.outputs.unprotected }}
          ACCESS_INCONCLUSIVE: ${{ steps.access_check.outputs.inconclusive }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          PROJECT_ROLLBACK_OUTCOME: ${{ steps.project_rollback.outcome }}
        run: |
          {
            echo "### Cloudflare Pages staging deployment"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Project: \`$CLOUDFLARE_PAGES_PROJECT\` (branch \`$STAGING_BRANCH\`)"
            echo "- Production URL: https://$CLOUDFLARE_PAGES_PROJECT.pages.dev/"
            echo "- Deployment URL: ${DEPLOYMENT_URL:-wrangler reported no URL - check the deploy log}"
            echo "- Branch alias URL: ${ALIAS_URL:-not reported by wrangler}"
            echo "- Deployment ID: ${DEPLOYMENT_ID:-not reported by wrangler}"
            if [ "$ACCESS_PROTECTED" = "true" ]; then
              echo "- Access verification: PROVEN on every probed URL"
            else
              echo "- Access verification: FAILED (unprotected=${ACCESS_UNPROTECTED:-false}, inconclusive=${ACCESS_INCONCLUSIVE:-unknown})"
              echo "- Deployment rollback: ${ROLLBACK_OUTCOME:-not attempted}"
              echo "- Project rollback: ${PROJECT_ROLLBACK_OUTCOME:-not attempted}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Cloudflare Access verification
        if: always()
        env:
          PROTECTED: ${{ steps.access_check.outputs.protected }}
          UNPROTECTED: ${{ steps.access_check.outputs.unprotected }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          PROJECT_ROLLBACK_OUTCOME: ${{ steps.project_rollback.outcome }}
        run: |
          if [ "$PROTECTED" != "true" ]; then
            if [ "$UNPROTECTED" = "true" ]; then
              detail="app content was reachable without Access"
            else
              detail="the probe was inconclusive after retries"
            fi
            echo "::error::Cloudflare Access was not proven (${detail}). The run failed closed. Rollback: deployment=${ROLLBACK_OUTCOME:-not attempted}, project=${PROJECT_ROLLBACK_OUTCOME:-not attempted}. If the app is still reachable, delete the staging project or set both Access applications to Block before retrying. Do not share the URL."
            exit 1
          fi
