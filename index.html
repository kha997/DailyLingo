<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DailyLingo - Học Tiếng Anh Mỗi Ngày</title>
    <meta name="description" content="Ứng dụng luyện tập tiếng Anh tương tác mỗi ngày: học từ vựng, luyện nghe nói, sắp xếp câu và theo dõi tiến độ học tập toàn diện." />
    <meta property="og:title" content="DailyLingo - Học Tiếng Anh Mỗi Ngày" />
    <meta property="og:description" content="Ứng dụng luyện tập tiếng Anh tương tác mỗi ngày: học từ vựng, luyện nghe nói, sắp xếp câu và theo dõi tiến độ học tập toàn diện." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('dailylingo_user_stats');
          var theme = 'light';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.theme) theme = parsed.theme;
          }
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased font-sans selection:bg-indigo-100 selection:text-indigo-900 dark:selection:bg-indigo-900/60 dark:selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
